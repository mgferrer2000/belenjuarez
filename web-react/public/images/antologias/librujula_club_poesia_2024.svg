<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Librujula Club de la Poesia 2024</title>
  <desc id="desc">Portada tipografica para la entrada Las cerezas de mi padre</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1eb"/>
      <stop offset="100%" stop-color="#ece4d7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="90" y="90" width="1020" height="620" fill="none" stroke="#c7a86d" stroke-width="2"/>
  <line x1="150" y1="180" x2="360" y2="180" stroke="#8b4a4a" stroke-width="3"/>
  <line x1="840" y1="620" x2="1050" y2="620" stroke="#8b4a4a" stroke-width="3"/>
  <text x="150" y="150" fill="#8b4a4a" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="4">LIBRUJULA</text>
  <text x="150" y="220" fill="#2a2623" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic">Las cerezas</text>
  <text x="150" y="300" fill="#2a2623" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic">de mi padre</text>
  <text x="152" y="360" fill="#6b6258" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="5">CLUB DE LA POESIA · 2024</text>
  <text x="152" y="525" fill="#2a2623" font-family="Georgia, 'Times New Roman', serif" font-size="38">Belen Juarez Jimenez</text>
  <text x="152" y="575" fill="#6b6258" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="3">PUBLICADO EN LIBRUJULA</text>
</svg>
